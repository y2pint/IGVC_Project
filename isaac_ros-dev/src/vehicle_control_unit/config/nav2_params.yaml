controller_server:
  ros__parameters:
    odom_topic: "/odometry/local"
    use_sim_time: False
    controller_frequency: 10.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.1
      movement_time_allowance: 20.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25
      stateful: false
    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"
      time_steps: 40          # 4 second horizon
      model_dt: 0.1
      batch_size: 2000        # good for AGX Orin
      vx_std: 0.5
      wz_std: 0.4             # was 0.1 — more steering exploration
      vx_max: 1.0             # matched to velocity_smoother
      vx_min: -0.5
      wz_max: 1.5             # matched to velocity_smoother
      iteration_count: 3      # was 1 — smoother convergence
      prune_distance: 3.0     # was 1.7 — less aggressive pruning
      transform_tolerance: 0.3
      temperature: 0.3
      gamma: 0.015
      motion_model: "DiffDrive"
      visualize: true
      reset_period: 2.0
      regenerate_noises: true
      min_turning_radius: 0.5
      enable_min_turning_radius: false
      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3
      critics: ["ConstraintCritic", "ObstaclesCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PathAngleCritic", "PreferForwardCritic"]
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.3
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.5
      ObstaclesCritic:
        enabled: true
        cost_power: 1
        repulsion_weight: 2.0
        critical_weight: 10.0
        consider_footprint: True
        collision_cost: 10000.0
        collision_margin_distance: 0.10
        near_goal_distance: 0.5
        inflation_radius: 0.45
        cost_scaling_factor: 5.0
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.5
        offset_from_furthest: 10
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        offset_from_furthest: 5
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.0
        mode: 0

local_costmap:
  local_costmap:
    ros__parameters:
      footprint_padding: 0.1
      update_frequency: 5.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      transform_tolerance: 0.3
      footprint: "[[0.55, 0.32], [0.55, -0.32], [-0.55, -0.32], [-0.55, 0.32]]"
      mark_threshold: 2
      always_send_full_costmap: True
      plugins: ['nvblox_layer', 'lane_layer', 'inflation_layer']

      lane_layer:
        plugin: "lane_costmap_layer/LaneCostmapLayer"
        enabled: True
        lane_topic: "/lane/occupancy_grid"
        lane_threshold: 50
        lane_cost: 254
        use_maximum: True

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 5.0
        inflation_radius: 0.35

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: odom
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        min_height: 0.3
        max_height: 2.0

global_costmap:
  global_costmap:
    ros__parameters:
      footprint_padding: 0.0
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: False
      footprint: "[[0.55, 0.32], [0.55, -0.32], [-0.55, -0.32], [-0.55, 0.32]]"
      footprint_padding: 0.03
      resolution: 0.05
      width: 40
      height: 40
      origin_x: -20.0
      origin_y: -20.0
      track_unknown_space: False
      mark_threshold: 2
      always_send_full_costmap: False
      plugins: ['nvblox_layer', 'inflation_layer']

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        cost_scaling_factor: 3.0
        inflation_radius: 0.50

      nvblox_layer:
        plugin: "nvblox::nav2::NvbloxCostmapLayer"
        enabled: True
        nav2_costmap_global_frame: map
        nvblox_map_slice_topic: "/nvblox_node/static_map_slice"
        convert_to_binary_costmap: True
        min_height: 0.3
        max_height: 2.0

map_server:
  ros__parameters:
    use_sim_time: False
    yaml_filename: ""

behavior_server:
  ros__parameters:
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
      acceleration_limit: 0.5
      deceleration_limit: 1.0
      minimum_speed: 0.02
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
      acceleration_limit: 0.5
      deceleration_limit: 1.0
      minimum_speed: 0.02
    wait:
      plugin: "nav2_behaviors/Wait"
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.1
    cycle_frequency: 10.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.0
    simulate_ahead_time: 2.0
    use_sim_time: False

velocity_smoother:
  ros__parameters:
    smoothing_frequency: 50.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.0, 0.0, 1.5]
    min_velocity: [-0.5, 0.0, -1.5]
    max_accel: [0.4, 0.0, 1.0]
    max_decel: [-0.6, 0.0, -1.5]
    odom_topic: odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0