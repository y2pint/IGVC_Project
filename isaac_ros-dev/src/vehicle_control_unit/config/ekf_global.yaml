ekf_global:
  ros__parameters:
    frequency: 5.0
    sensor_timeout: 0.6
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    permit_corrected_publication: true

    debug: true
    debug_out_file: /tmp/ekf_global_debug.txt
    print_diagnostics: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    base_link_frame_output: base_link
    world_frame: map

    odom0: /odometry/local
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  false, false,
      false, false, true,
      false, false, false
    ]
    odom0_twist_rejection_threshold: 1.0
    odom0_pose_rejection_threshold: 10.0

    odom1: /odometry/gps
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false
    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]
    odom1_pose_rejection_threshold: 10.0

    transform_timeout: 0.2
    transform_time_offset: 0.0