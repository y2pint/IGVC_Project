ekf_global:
  ros__parameters:

    # -----------------------
    # Core EKF settings
    # -----------------------
    frequency: 20.0
    sensor_timeout: 2.0
    two_d_mode: true
    permit_corrected_publication: true

    publish_tf: true
    publish_acceleration: false

    # -----------------------
    # Debug (TEMPORARY)
    # -----------------------
    debug: true
    debug_out_file: /tmp/ekf_global_debug.txt
    print_diagnostics: true

    # -----------------------
    # Frame conventions
    # -----------------------
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    base_link_frame_output: base_link
    world_frame: map            # GLOBAL EKF publishes map -> odom

    # -----------------------
    # Input: local EKF output
    # -----------------------
    # This is the filtered odometry from ekf_local
    odom0: /odometry/local
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    #
    # Rationale:
    # - Global EKF only needs position + yaw
    # - No velocities required
    # - No IMU here
    #
    odom0_config: [
      true,  true,  false,   # x, y
      false, false, true,    # yaw
      false, false, false,   # linear velocity
      false, false, false,   # angular velocity
      false, false, false
    ]

    # -----------------------
    # QoS overrides (CRITICAL)
    # -----------------------
    qos_overrides:
      /odometry/local:
        subscription:
          reliability: reliable
          history: keep_last
          depth: 10

      /odometry/global:
        publisher:
          reliability: reliable
          history: keep_last
          depth: 10

      /tf:
        publisher:
          reliability: reliable
          history: keep_last
          depth: 100
