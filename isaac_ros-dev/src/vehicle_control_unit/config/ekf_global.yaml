ekf_global:
  ros__parameters:
    frequency: 20.0
    sensor_timeout: 0.5
    two_d_mode: true

    publish_tf: true
    publish_acceleration: false
    permit_corrected_publication: true

    debug: true
    debug_out_file: /tmp/ekf_global_debug.txt
    print_diagnostics: true

    # Frames
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    base_link_frame_output: base_link
    world_frame: map   # <-- global EKF publishes map->odom

    # ------------------------------------------------------------
    # Input 0: local EKF output
    # Use it mainly for velocity + yaw_rate (not absolute position)
    # ------------------------------------------------------------
    odom0: /odometry/local
    odom0_queue_size: 10
    odom0_differential: false
    odom0_relative: false

    # Recommended: use TWIST (vx, vy, wz). Keep pose mostly off.
    # State order:
    # [x, y, z,
    #  roll, pitch, yaw,
    #  vx, vy, vz,
    #  vroll, vpitch, vyaw,
    #  ax, ay, az]
    odom0_config: [
      false, false, false,
      false, false, false,
      true,  true,  false,
      false, false, true,
      false, false, false
    ]

    odom0_twist_rejection_threshold: 1.0
    odom0_pose_rejection_threshold: 10.0

    # ------------------------------------------------------------
    # Input 1: GPS fused odometry from navsat_transform
    # Use it for absolute x,y in map/odom (no yaw)
    # ------------------------------------------------------------
    odom1: /odometry/gps
    odom1_queue_size: 10
    odom1_differential: false
    odom1_relative: false

    odom1_config: [
      true,  true,  false,
      false, false, false,
      false, false, false,
      false, false, false,
      false, false, false
    ]

    odom1_pose_rejection_threshold: 10.0
    odom1_twist_rejection_threshold: 1.0

    transform_timeout: 0.2
    transform_time_offset: 0.0

    qos_overrides:
      /odometry/local:
        subscription:
          reliability: reliable
          history: keep_last
          depth: 10
      /odometry/gps:
        subscription:
          reliability: reliable
          history: keep_last
          depth: 10
      /odometry/global:
        publisher:
          reliability: reliable
          history: keep_last
          depth: 10
      /tf:
        publisher:
          reliability: reliable
          history: keep_last
          depth: 100
