ekf_local:
  ros__parameters:
    frequency: 50.0
    sensor_timeout: 0.2
    two_d_mode: true

    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # Helps reduce control oscillation due to filter lag
    predict_to_current_time: true

    odom0: /wheel/odom
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # PASS-THROUGH: only fuse what you truly need
    # Recommended: x, y, yaw, vx (no vy)
    odom0_config: [
      true,  true,  false,
      false, false, true,
      true,  false, false,
      false, false, false,
      false, false, false
    ]

    # Disable IMU completely for this pass-through test
    # imu0: ...
